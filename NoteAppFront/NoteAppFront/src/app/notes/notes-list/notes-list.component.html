<div class="card">
  <div class="card-header"> {{title}}</div>

  <div class="card-body">
    <div class="table-responsive">
      <table class="table mb-0">
        <thead>
          <tr>
            <th>Title</th>
            <th>Content</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let note of notes$ | async" [style.backgroundColor]="note.color">
            <td>{{ note.title }}</td>
            <td style="white-space: normal; width: 500px;">{{ note.content }}</td>
            <td style="text-align: right; vertical-align:middle;">
              <button class="btn btn-outline-primary btn-sm" [routerLink]="['/notes', note.noteId]">Edit</button>
              <button class="btn btn-outline-primary btn-sm" (click)="delete(note.noteId)">Delete</button>
            </td>
            <br>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
