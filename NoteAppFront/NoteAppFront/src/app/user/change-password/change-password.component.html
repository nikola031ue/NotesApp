<h1>Register</h1>
<hr>
<div class="changePassword">
  <div class="col-md-4">
    <div *ngIf="showError" class="alert alert-danger" role="alert">
      {{errorMessage}}
    </div>
    <form [formGroup]="passwordForm" (ngSubmit)="changePassword(passwordForm.value)" autocomplete="off" novalidate>
      <div class="form-group">
        <label for="oldPassword">Old password:</label>
        <em *ngIf="validateControl('oldPassword') && hasError('oldPassword', 'required')">Required</em>
        <input formControlName="oldPassword" name="oldPassword" required id="oldPassword" type="password"
          class="form-control" placeholder="Old password..." />
      </div><br>
      <div formGroupName="passwordGroup">
        <div class="form-group">
          <label for="newPassword">New password:</label>
          <em
            *ngIf="validateControl('passwordGroup.newPassword') && hasError('passwordGroup.newPassword', 'minlength')">Password
            must have at least 3 characters.</em>
          <em *ngIf="validateControl('newPassword') && hasError('newPassword', 'required')">Required</em>
          <input formControlName="newPassword" name="newPassword" required id="newPassword" type="password"
            class="form-control" placeholder="New password..." [ngClass]="{'is-invalid': passwordForm.get('passwordGroup').errors ||
          ((passwordForm.get('passwordGroup.newPassword').invalid ||
          passwordForm.get('passwordGroup.newPassword').dirty) &&
           !passwordForm.get('passwordGroup.newPassword').valid) }" />
        </div><br>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password:</label>
          <em *ngIf="validateControl('confirmPassword') && hasError('confirmPassword', 'required')">Required</em>
          <input formControlName="confirmPassword" name="confirmPassword" required id="confirmPassword" type="password"
            class="form-control" placeholder="Confirm Password..." [ngClass]="{'is-invalid': passwordForm.get('passwordGroup').errors ||
          ((passwordForm.get('passwordGroup.confirmPassword').invalid ||
          passwordForm.get('passwordGroup.confirmPassword').dirty) &&
           !passwordForm.get('passwordGroup.confirmPassword').valid) }" />
        </div>
      </div><br>
      <br>
      <button type="submit" [disabled]="passwordForm.invalid" class="btn btn-primary">Change password</button>
      <button type="submit" id="cancel" (click)="cancel()" class="btn btn-secondary">Cancel</button>
    </form>
    <br>
  </div>
</div>
