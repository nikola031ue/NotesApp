<h1>Login</h1>
<hr>
<div class="login">
  <div class="col-md-4">
    <div *ngIf="showError" class="alert alert-danger" role="alert">
      {{errorMessage}}
    </div>
    <form [formGroup]="loginForm" (ngSubmit)="loginUser(loginForm.value)" autocomplete="off" novalidate>
      <div class="form-group">
        <label for="userName">Email:</label>
        <em *ngIf="validateControl('email') && hasError('email', 'email')">Wrong email format</em>
        <em *ngIf="validateControl('email') && hasError('email', 'required')">Required</em>
        <input formControlName="email" name="email" required id="email" type="text" class="form-control"
          placeholder="Email..." />
      </div><br>
      <div class="form-group">
        <label for="password">Password:</label>
        <em *ngIf="validateControl('password') && hasError('password', 'required')">Required</em>
        <input formControlName="password" name="password" required id="password" type="password" class="form-control"
          placeholder="Password..." />
      </div>
      <br>
      <button type="submit" [disabled]="loginForm.invalid" class="btn btn-primary">Login</button>
    </form>
    <br>
  </div>
</div>
